name: Build and Export Unsigned IPA

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4.1'

    - name: Install CocoaPods
      run: |
        gem install cocoapods
        pod install --project-directory=App

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.2.0'

    # --- CRITICAL CHANGES ---
    - name: Generate Package.swift
      run: ./package.sh
      working-directory: ${{ github.workspace }}  # Ensure correct directory

    - name: Print Package.swift  # Verify generated file
      run: cat Package.swift
      working-directory: ${{ github.workspace }}

    # --- Temporarily disable caching ---
    # - uses: actions/cache@v3
    #   with:
    #     path: ...
    #     key: ...
    - name: Clean CocoaPods cache
      run: |
          rm -rf ~/.cocoapods
          rm -rf Pods
      working-directory: ${{ github.workspace }}

    - name: Remove DerivedData and SPM Cache
      run: |
        rm -rf ~/Library/Developer/Xcode/DerivedData
        rm -rf ~/Library/Caches/org.swift.swiftpm
      working-directory: ${{ github.workspace }}

    - name: Build and Export IPA
      run: |
        xcodebuild clean -project App/Mochi.xcodeproj -scheme Mochi -configuration Release
        xcodebuild archive -project App/Mochi.xcodeproj -scheme Mochi -configuration Release -archivePath $PWD/build/Mochi.xcarchive
        xcodebuild -exportArchive -archivePath $PWD/build/Mochi.xcarchive -exportOptionsPlist App/exportOptions.plist -exportPath $PWD/build

    - name: Upload IPA as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Mochi.ipa
        path: build/Mochi.ipa
